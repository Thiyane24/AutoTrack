[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autotrack"
version = "0.2.0"
description = "Gmail → Silver → DuckDB → Email pipeline for internship tracking."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Thiyane Xavier" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pandas>=2.2,<3.0",
    "duckdb>=1.0,<2.0",
    "beautifulsoup4>=4.12,<5.0",
    "requests>=2.32,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
airflow = ["apache-airflow>=2.9"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
autotrack = "autotrack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"autotrack" = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = [
    "E501",  # line length is handled by the formatter
    "S101",  # asserts are fine in tests
    # UP rules: the dataclass/type-annotation rewrites are valid
    # Pylint-style cleanup but not bugs. The codebase is on
    # Python 3.10+ so deprecation warnings are stylistic only.
    "UP035",  # `typing.List`/`Iterable` → builtins / collections.abc
    "UP006",  # `List[T]` → `list[T]` (PEP 585)
    "UP007",  # `Optional[X]` → `X | None`
    "UP045",  # `Optional[bool]` → `bool | None`
    # B905: `zip()` without `strict=` is a Python 3.10+ lint, but
    # every zip() call in this codebase is local and
    # length-checked upstream. False positive at this scale.
    "B905",
]
# `S` (security) exceptions for known-safe calls.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["dags/src"]
filterwarnings = [
    "error",
    # beautifulsoup4 emits a deprecation warning we can't fix:
    "ignore::DeprecationWarning:bs4.*",
]
